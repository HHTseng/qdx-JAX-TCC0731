model: GNN
env_type: STANDARD
d: 3
max_steps: 50
which_gates:
  - cx
  - h
  - s
  - sqrt_x
  - cz
  - sqrt_xx
graph: All-to-All
softness: 1
validation_softness: null
p_i: 0.9
lambda: 10
seed: 42
lr: 0.001
num_envs_per_task: 16
num_steps: 50
total_timesteps: 2000000
update_epochs: 3
num_minibatches: 4
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.2
ent_coef: 0.02
vf_coef: 0.5
max_grad_norm: 0.25
activation: relu
hidden_dim: 32
anneal_lr: true
compute_metrics: true
gnn_hidden_dim: 64
gnn_relation_dim: 8
gnn_gate_dim: 8
gnn_num_layers: 3

graphs:
  - All-to-All
  - NN-1
  - NN-2

train_tasks:
  - [5, 1, 3]
  - [6, 1, 3]
  - [7, 1, 3]

validation_tasks:
  - [5, 1, 3]
  - [6, 1, 3]
  - [7, 1, 3]
  - [8, 1, 3]
  - [8, 2, 3]
  - [8, 3, 3]

skip_validation: false
skip_distance: false
dry_run: false
output_dir: null
